services:
  mysql:
    image: mysql:8.0
    container_name: frota_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: frota
      MYSQL_USER: frota_user
      MYSQL_PASSWORD: frota_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: